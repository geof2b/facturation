<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CESAD Facturation - Infirmières</title>
    <link rel="stylesheet" href="css/nurses.css">    <link rel="stylesheet" href="css/commun.css">

</head>

<body>
    <div id="app-container">
        <nav id="topbar">
<div class="topbar-logo">
                <div id="server-status-light"></div>
                <span style="margin:0px 60px 0px 30px">CESAD</span>
            </div>            <ul>
                <li><a href="dashboard.html" class="nav-link">📊 Tableau de Bord</a></li>
                <li><a href="invoicing.html" class="nav-link">🧾 Facturation</a></li>
                <li><a href="history.html" class="nav-link">🗂️ Historique</a></li>
                <li><a href="nurses.html" class="nav-link">👩‍⚕️ Infirmières</a></li>
                <li><a href="payments.html" class="nav-link">💳 Suivi Paiements</a></li>
            </ul>
        </nav>
        <main id="main-content">
            <div id="nurses" class="view">
                <div class="view-header">
                    <h1>Gestion des Infirmières</h1>
                    <div class="header-buttons">
                        <button id="toggle-archived-btn">Voir les archives</button>
                        <button id="add-nurse-btn">Ajouter une Infirmière</button>
                        <button id="import-nurses-btn" class="import-header-btn">📤 Importer Infirmières</button>
                        <input type="file" id="nurses-file-input" accept=".csv" style="display: none;">
                    </div>
                </div>
                <div id="nurses-list"></div>
            </div>
        </main>
    </div>

    <div id="nurse-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2 id="nurse-modal-title">Ajouter une Infirmière</h2>
            <form id="nurse-form">
                <input type="hidden" id="nurse-id">
                <label for="nurse-firstname">Prénom :</label> <input type="text" id="nurse-firstname" required>
                <label for="nurse-lastname">Nom :</label> <input type="text" id="nurse-lastname" required>
                <label for="nurse-account-id">N° de Compte (ID) :</label> <input type="text" id="nurse-account-id"
                    required>
                <label for="nurse-address" class="full-width">Adresse :</label> <textarea id="nurse-address" rows="4"
                    class="full-width"></textarea>
                <label for="nurse-commission">Commission (%) :</label> <input type="number" id="nurse-commission"
                    step="0.1" min="0" value="15" required>
                <button type="submit">Sauvegarder</button>
            </form>
        </div>
    </div>

    <div id="ledger-modal" class="modal">
        <div class="modal-content ledger-content">
            <span class="close-btn">&times;</span>
            <div class="ledger-header">
                <h2 id="ledger-modal-title">Relevé de compte</h2>
                <div class="ledger-controls">
                    <label for="ledger-year-selector">Année :</label>
                    <select id="ledger-year-selector"></select>
                    <button id="print-ledger-btn">Imprimer</button>
                </div>
            </div>
            <div id="ledger-details"></div>
            <div id="ledger-summary"></div>
            <div class="ledger-footer-actions">
                <button id="add-balance-btn">Ajouter/Modif. Solde 2024</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>

    <script src="js/db.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/import.js"></script>
    <script src="js/nurses.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
